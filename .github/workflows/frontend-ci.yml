name: Frontend CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    name: Frontend - Build & Test

    steps:
    # 1. Baixa o código do repositório
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Verifica se pasta frontend existe
    - name: Check if frontend exists
      id: check-frontend
      run: |
        if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    # 3. Configura o Node.js
    - name: Setup Node.js
      if: steps.check-frontend.outputs.exists == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    # 4. Cache das dependências do NPM
    - name: Cache Node.js modules
      if: steps.check-frontend.outputs.exists == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-frontend-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-frontend-

    # 5. Instala dependências do NPM
    - name: Install NPM dependencies
      if: steps.check-frontend.outputs.exists == 'true'
      working-directory: ./frontend
      run: npm install

    # 6. Executa lint (se configurado)
    - name: Run linter
      if: steps.check-frontend.outputs.exists == 'true'
      working-directory: ./frontend
      run: |
        if grep -q '"lint"' package.json; then
          npm run lint
        else
          echo "Lint script not found, skipping..."
        fi

    # 7. Executa testes (se configurados)
    - name: Run tests
      if: steps.check-frontend.outputs.exists == 'true'
      working-directory: ./frontend
      run: |
        if grep -q '"test"' package.json; then
          npm run test
        else
          echo "Test script not found, skipping..."
        fi

    # 8. Build do frontend
    - name: Build frontend
      if: steps.check-frontend.outputs.exists == 'true'
      working-directory: ./frontend
      run: npm run build

    # 9. Mensagem se frontend não existe
    - name: Frontend not found
      if: steps.check-frontend.outputs.exists == 'false'
      run: echo "Frontend folder not found or no package.json. Skipping frontend tests."

